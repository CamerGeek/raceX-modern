services:
  - type: web
    name: racex-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_VERSION
        value: initial-migration
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
